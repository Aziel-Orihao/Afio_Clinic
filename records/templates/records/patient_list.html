<!DOCTYPE html>
<html>
<head>
    <title>Patients</title>
</head>
<body>
    <h1>All Patients</h1>
    <ul>
        {% for patient in patients %}
            <li>{{ patient.first_name }} {{ patient.last_name }} - {{ patient.dob }} - {{ patient.phone }}</li>
        {% empty %}
            <li>No patients yet.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'add_patient' %}">Add a new patient</a>
</body>
</html>
